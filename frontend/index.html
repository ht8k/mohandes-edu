<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>منصة المهندس التعليمية</title>
    <script>
      // Decode the SPA fallback path injected by 404.html. After redirection,
      // the URL looks like `/<base>/?/some/path` — rewrite history back to
      // `/<base>/some/path` before React Router boots.
      (function () {
        var l = window.location;
        if (l.search.indexOf("?/") === 0 || l.search.indexOf("&/") !== -1) {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          if (decoded.charAt(0) === "/") {
            window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
